# Capability manifest for the organization's admission check.
#
# jcheng-scenarios is a SCEN-layer repository: a declarative scenario catalog
# that is validated offline. It is not a domain-42 runtime capability and is
# not imported by any runtime repository.
#
# This manifest uses the canonical capability-manifest.v1 shape. Because the
# repository is offline, every runtime field is vacuous:
#   - safety.class: offline
#   - safety.scopes: []            (no actuator scope is requested)
#   - safety.requires_lease: true  (required by the schema; no lease is used)
#   - runtime.ros_domains: []      (joins no domain)
#   - runtime.publishes/subscribes: []
# The contract block records the interfaces release this repository is written
# against. jcheng-scenarios consumes no contract at runtime; the block exists
# so an admission check can compare every repository with one schema.
# See .github docs/repo-boundaries.md (Schema Ownership Matrix).
schema_version: 1
name: jcheng-scenarios
version: 0.1.0
contract:
  interfaces: ">=0.2,<0.3"
  contract_hash: "sha256:afca22a42f7163e0351d185d5a8577b0b51f2f3da4b92278f161a4a7d2c35b1c"
  system_api: ">=0.2,<0.4"
safety:
  class: offline
  scopes: []
  requires_lease: true
  max_rate_hz: 1
  deadman_ms: 500
hardware_access: none
runtime:
  ros_domains: []
  publishes: []
  subscribes: []
