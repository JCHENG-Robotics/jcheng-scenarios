[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jcheng-scenarios"
version = "0.1.0"
description = "Declarative SCEN scenario catalog for the JCHENG Robotics ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
jcheng-scenarios = "jcheng_scenarios.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
