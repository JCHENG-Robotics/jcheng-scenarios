schema_version: jcheng.scenario.profile.v1
id: ore_sorting
version: 0.1.0
title: Ore sorting workcell
domain: mining
summary: >-
  A single-arm workcell that separates ore from gangue on a pick surface and
  places ore instances into an ore bin. The profiles declare the environment,
  vocabulary, task conditions, capability requirements, operational risks and
  evaluation metrics. Nothing in this directory is an execution plan or a
  measured result.
delivery: In progress
verification: Unverified
provenance:
  author: JCHENG Robotics
  created: 2026-11-27
  updated: 2026-11-27
  source_kind: design
  sources:
    - kind: internal_design
      reference: jcheng-perception/docs/ORE_SCENE_UNDERSTANDING.md
      note: Scene-understanding stages, boundaries and the no-fabrication rules.
    - kind: internal_design
      reference: jcheng-perception/docs/ORE_SCENE_EVALUATION.md
      note: Data-source separation and reporting principles reused by the evaluation profile.
    - kind: internal_design
      reference: jcheng-perception/docs/SCENE_REPRESENTATION.md
      note: Visible-versus-true separation and the forbidden measurement fields.
profiles:
  environment: environment.yaml
  semantics: semantics.yaml
  task: task.yaml
  capability_requirements: capability-requirements.yaml
  operational_constraints: operational-constraints.yaml
  evaluation: evaluation.yaml
consumers:
  - repo: jcheng-devices
    role: >-
      Match abstract device requirements to versioned device capability
      profiles. The repository is planned; no device profile exists yet.
    integration: Not started
  - repo: jcheng-applications
    role: >-
      Parse the task specification and orchestrate task intent through the
      system gateway. Execution sequencing is owned there, not here.
    integration: Not started
  - repo: jcheng-simulation
    role: >-
      Load the environment description as a simulated workcell in a future
      milestone. No simulation asset is generated by this repository.
    integration: Not started
  - repo: jcheng-benchmark
    role: >-
      Execute the evaluation specification over recorded or synthetic data and
      emit a provenance-labelled report.
    integration: Not started
  - repo: jcheng-perception
    role: >-
      Provide advisory instance and scene observations. Consuming the semantic
      profile requires a contract review first.
    integration: Not started
boundaries:
  - This repository defines scenarios; it is not a runtime task executor.
  - It does not join DDS, start ROS 2 nodes or publish control intent.
  - It does not access real hardware or issue motion commands.
  - It does not duplicate the orchestration, simulation or benchmark owners.
  - Scenario constraints never replace the system layer's runtime safety mechanism.
  - Unverified parameters, metrics and device compatibility are labelled, never asserted as fact.
