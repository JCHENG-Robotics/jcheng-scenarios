name: scenarios-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet 'PyYAML==6.0.2' 'jsonschema==4.23.0' 'pytest==8.3.4'
          python3 -m pip install --quiet -e .
      - name: Repository gate
        shell: bash
        run: bash scripts/check_repo_gate.sh

  scenarios-gate:
    name: scenarios-gate
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - name: Gate
        run: echo "registry, schema validation, offline catalog checks and tests passed"
